<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>模拟招聘网站</title></head>
  <body>
    <button id="login-button">登录</button>
    <div id="login-modal" style="display:none">
      <div id="mfa-row" style="display:none">请输入 MFA 验证码</div>
    </div>
    <select id="city">
      <option value="">全国</option>
      <option value="深圳">深圳 · 2</option>
      <option value="北京">北京 · 1</option>
    </select>
    <input id="keyword" value="">
    <button class="search-btn" type="button">搜索</button>
    <div id="result-count">等待搜索</div>
    <section id="jobs">
      <article class="modern-job-card" onclick="location.href='/job.html?id=101'">
        <div class="job-card-top"><h3>AI Agent 工程师</h3><p>深圳 · 南山区</p></div>
        <span class="salary">25-40K</span>
        <div class="company-line"><b>示例科技</b></div>
        <div class="job-tags"><span>Python</span><span>LangGraph</span></div>
      </article>
    </section>
    <script>
      document.querySelector('.search-btn').addEventListener('click', () => {
        document.querySelector('#result-count').textContent = '为你找到 1 个职位';
      });
      document.querySelector('#login-button').addEventListener('click', () => {
        document.querySelector('#login-modal').style.display = 'block';
        document.querySelector('#mfa-row').style.display = 'block';
      });
    </script>
  </body>
</html>
