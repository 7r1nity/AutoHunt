<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应聘方中心 - 模拟招聘网</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="brand">🧑‍💼 模拟招聘网</div>
    <a href="/">职位列表</a>
    <a href="/applicant.html" class="active">应聘方中心</a>
    <a href="/messages.html">消息中心</a>
    <a href="/employer.html">招聘方中心</a>
  </nav>

  <div class="container">
    <div class="card" id="login-card">
      <h3 style="margin-bottom:12px;">应聘方登录 / 注册</h3>
      <div class="row">
        <div class="col"><input id="email" placeholder="邮箱，如 ai_applicant@example.com" /></div>
        <div class="col"><input id="name" placeholder="姓名" /></div>
        <div class="col"><input id="phone" placeholder="手机号（可选）" /></div>
        <div class="col" id="mfa-box" style="display:none"><input id="mfa-code" maxlength="6" placeholder="MFA 验证码" /><small id="mfa-hint" class="demo-code"></small></div>
        <button id="login-action" onclick="login()">获取验证码</button>
      </div>
      <p class="muted" style="margin-top:8px;">种子账号：ai_applicant@example.com</p>
    </div>

    <div class="card" id="me-card" style="display:none;">
      <div class="row">
        <div><strong id="me-info"></strong></div>
        <div class="spacer"></div>
        <button class="secondary" onclick="logout()">退出</button>
      </div>
    </div>

    <div id="main" style="display:none;">
      <div class="tabs">
        <button class="active" data-tab="tab-resume">我的简历</button>
        <button data-tab="tab-applications">我的投递</button>
        <button data-tab="tab-chat">聊天</button>
        <button data-tab="tab-form">填写表单</button>
      </div>

      <div id="tab-resume" class="tab-page active">
        <div class="card">
          <h3>创建简历</h3>
          <div class="row">
            <div class="col"><input id="r-name" placeholder="姓名" /></div>
            <div class="col"><input id="r-phone" placeholder="电话" /></div>
            <div class="col"><input id="r-years" type="number" step="0.5" value="3" placeholder="工作年限" /></div>
            <div class="col">
              <select id="r-education">
                <option>本科</option>
                <option>硕士</option>
                <option>博士</option>
                <option>大专</option>
                <option>不限</option>
              </select>
            </div>
          </div>
          <div style="margin-top:8px;">
            <input id="r-skills" placeholder="技能，逗号分隔，如 Python,SQL,数据分析,机器学习" style="width:100%;" />
          </div>
          <div style="margin-top:8px;">
            <textarea id="r-summary" placeholder="个人总结"></textarea>
          </div>
          <button style="margin-top:8px;" onclick="handleCreateResume()">创建 / 更新简历</button>
        </div>
        <div id="resume-list"></div>
      </div>

      <div id="tab-applications" class="tab-page">
        <div id="application-list"></div>
      </div>

      <div id="tab-chat" class="tab-page">
        <div class="card">
          <h3>会话列表</h3>
          <div id="conversation-list" class="muted"></div>
        </div>
        <div class="card">
          <h3>与招聘方聊天</h3>
          <div class="row">
            <div class="col"><input id="chat-user-id" type="number" placeholder="对方用户 ID，如 1" /></div>
            <button onclick="loadMessages()">加载消息</button>
          </div>
          <div id="chat-list" class="msg-list" style="margin-top:12px;"></div>
          <div class="row">
            <div class="col"><input id="chat-input" placeholder="输入消息..." /></div>
            <button onclick="handleSendMessage()">发送</button>
          </div>
        </div>
      </div>

      <div id="tab-form" class="tab-page">
        <div class="card">
          <h3>填写招聘方表单</h3>
          <div class="row">
            <div class="col"><input id="form-id" type="number" placeholder="表单 ID，如 1" /></div>
            <button onclick="loadForm()">查询表单</button>
          </div>
          <div id="form-box" style="margin-top:12px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    let myResumes = [];
    let currentChatUser = null;
    let loginChallenge = '';

    async function init() {
      const id = getIdentity();
      if (id.userId && id.userRole === 'applicant') {
        showMain();
      } else if (id.userId && id.userRole === 'employer') {
        document.getElementById('login-card').innerHTML = '<p class="muted">当前是招聘方账号，请到 <a href="/employer.html">招聘方中心</a> 操作。</p>';
      } else {
        document.getElementById('email').value = 'ai_applicant@example.com';
        document.getElementById('name').value = 'AI求职者';
      }
      bindTabs();
    }

    function bindTabs() {
      document.querySelectorAll('.tabs button').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-page').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab).classList.add('active');
        };
      });
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const name = document.getElementById('name').value.trim() || '求职者';
      const phone = document.getElementById('phone').value.trim() || null;
      if (!email) { toast('请填写邮箱'); return; }
      try {
        if (!loginChallenge) {
          const challenge = await requestMfa(email);
          loginChallenge = challenge.challenge_id;
          document.getElementById('mfa-box').style.display = 'block';
          document.getElementById('mfa-hint').textContent = `模拟验证码：${challenge.demo_code}`;
          document.getElementById('login-action').textContent = '验证并登录';
          return;
        }
        await verifyMfa(loginChallenge, document.getElementById('mfa-code').value.trim());
        const user = await registerUser('applicant', name, email, phone);
        setIdentity(user.id, 'applicant');
        toast('MFA 验证成功，用户 ID ' + user.id);
        showMain();
      } catch (e) { toast('登录失败：' + e.message); }
    }

    function logout() {
      clearIdentity();
      location.reload();
    }

    async function showMain() {
      const id = getIdentity();
      document.getElementById('login-card').style.display = 'none';
      document.getElementById('me-card').style.display = 'block';
      document.getElementById('me-info').textContent = `应聘方用户 ID：${id.userId}`;
      document.getElementById('main').style.display = 'block';
      await Promise.all([loadResumes(), loadApplications(), loadConversations()]);
    }

    async function handleCreateResume() {
      const body = {
        name: document.getElementById('r-name').value.trim() || '求职者',
        phone: document.getElementById('r-phone').value.trim() || null,
        experience_years: parseFloat(document.getElementById('r-years').value) || 0,
        education: document.getElementById('r-education').value,
        skills: document.getElementById('r-skills').value.split(',').map(s => s.trim()).filter(Boolean),
        summary: document.getElementById('r-summary').value.trim(),
        work_history: []
      };
      try {
        const resume = await createResume(body);
        toast('简历创建成功，ID ' + resume.id);
        loadResumes();
      } catch (e) { toast('创建失败：' + e.message); }
    }

    async function loadResumes() {
      try {
        myResumes = await getMyResumes();
        const box = document.getElementById('resume-list');
        if (!myResumes.length) { box.innerHTML = '<div class="card muted">暂无简历，请先创建。</div>'; return; }
        box.innerHTML = myResumes.map(r => `
          <div class="card">
            <div class="row">
              <strong>${escapeHtml(r.name)}</strong>
              <span class="badge">${escapeHtml(r.education)}</span>
              <span class="badge gray">${escapeHtml(resumeExperienceLabel(r))}</span>
              <span class="muted">简历 ID ${r.id}</span>
            </div>
            <div style="margin-top:8px;">${(r.skills || []).map(s => `<span class="badge green">${escapeHtml(s)}</span>`).join('')}</div>
            <p class="muted" style="margin-top:8px;">${escapeHtml(r.summary)}</p>
          </div>
        `).join('');
      } catch (e) { toast('加载简历失败：' + e.message); }
    }

    async function loadApplications() {
      try {
        const apps = await getMyApplications();
        const box = document.getElementById('application-list');
        if (!apps.length) { box.innerHTML = '<div class="card muted">暂无投递记录。</div>'; return; }
        box.innerHTML = apps.map(a => `
          <div class="card">
            <div class="row">
              <strong>职位 ID ${a.job_id}</strong>
              <span class="badge">${escapeHtml(a.status)}</span>
              <span class="muted">投递 ID ${a.id} · 匹配度 ${a.match_score ?? '-'}</span>
            </div>
            <p class="muted" style="margin-top:6px;">${escapeHtml(a.cover_letter)}</p>
          </div>
        `).join('');
      } catch (e) { toast('加载投递失败：' + e.message); }
    }

    async function loadConversations() {
      try {
        const convs = await getConversations();
        const box = document.getElementById('conversation-list');
        if (!convs.length) { box.textContent = '暂无会话'; return; }
        box.innerHTML = convs.map(c => `
          <div class="row" style="margin-bottom:6px;">
            <button class="secondary" onclick="selectChat(${c.user_id}, '${c.user_name}')">${escapeHtml(c.user_name)}（ID ${c.user_id}）</button>
            <span class="muted">${escapeHtml(c.last_message)} · 未读 ${c.unread_count}</span>
          </div>
        `).join('');
      } catch (e) { toast('加载会话失败：' + e.message); }
    }

    function selectChat(userId, name) {
      currentChatUser = userId;
      document.getElementById('chat-user-id').value = userId;
      document.getElementById('chat-input').placeholder = `发给 ${name}...`;
      loadMessages();
    }

    async function loadMessages() {
      const userId = parseInt(document.getElementById('chat-user-id').value, 10);
      if (!userId) { toast('请填写对方用户 ID'); return; }
      currentChatUser = userId;
      try {
        const msgs = await getMessages(userId);
        const box = document.getElementById('chat-list');
        if (!msgs.length) { box.innerHTML = '<div class="muted">暂无消息</div>'; return; }
        const me = getIdentity();
        box.innerHTML = msgs.map(m => `
          <div class="msg-item ${m.sender_id == me.userId ? 'mine' : ''}">
            <div class="meta">${m.sender_role} #${m.sender_id} · ${new Date(m.created_at).toLocaleString()}</div>
            <div class="content">${escapeHtml(m.content)}</div>
          </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
      } catch (e) { toast('加载消息失败：' + e.message); }
    }

    async function handleSendMessage() {
      if (!currentChatUser) { toast('请先选择或输入对方用户 ID'); return; }
      const content = document.getElementById('chat-input').value.trim();
      if (!content) { toast('请输入消息内容'); return; }
      try {
        await sendMessage({ recipient_id: currentChatUser, content });
        document.getElementById('chat-input').value = '';
        loadMessages();
        loadConversations();
      } catch (e) { toast('发送失败：' + e.message); }
    }

    let currentForm = null;
    async function loadForm() {
      const formId = parseInt(document.getElementById('form-id').value, 10);
      if (!formId) { toast('请填写表单 ID'); return; }
      try {
        currentForm = await getForm(formId);
        renderForm(currentForm);
      } catch (e) { toast('查询表单失败：' + e.message); }
    }

    function renderForm(form) {
      const box = document.getElementById('form-box');
      const fields = form.fields || [];
      box.innerHTML = `
        <h4>${escapeHtml(form.title)}</h4>
        <p class="muted">${escapeHtml(form.description)}</p>
        ${fields.map((f, i) => `
          <div class="form-field">
            <label>${escapeHtml(f.label)} ${f.required ? '<span style="color:red;">*</span>' : ''}</label>
            ${renderField(f, i)}
          </div>
        `).join('')}
        <button onclick="handleSubmitForm()">提交表单</button>
      `;
    }

    function renderField(f, i) {
      if (f.type === 'select') {
        return `<select data-field="${escapeHtml(f.name)}">
          ${(f.options || []).map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}
        </select>`;
      } else if (f.type === 'radio' || f.type === 'checkbox') {
        return `<div class="options">${(f.options || []).map((o, j) => `
          <label><input type="${f.type}" name="field-${i}" value="${escapeHtml(o)}" /> ${escapeHtml(o)}</label>
        `).join('')}</div>`;
      } else if (f.type === 'textarea') {
        return `<textarea data-field="${escapeHtml(f.name)}"></textarea>`;
      }
      return `<input data-field="${escapeHtml(f.name)}" type="${f.type === 'number' ? 'number' : 'text'}" />`;
    }

    async function handleSubmitForm() {
      if (!currentForm) { toast('请先查询表单'); return; }
      const answers = {};
      document.querySelectorAll('[data-field]').forEach(el => { answers[el.dataset.field] = el.value; });
      document.querySelectorAll('.options').forEach(div => {
        const checked = [...div.querySelectorAll('input:checked')].map(i => i.value);
        if (checked.length) {
          const name = [...div.parentElement.querySelectorAll('label')].length ? '' : '';
        }
      });
      // 单选/复选：按 name 分组收集
      const groups = {};
      document.querySelectorAll('.options input:checked').forEach(inp => {
        if (!groups[inp.name]) groups[inp.name] = [];
        groups[inp.name].push(inp.value);
      });
      for (const [name, vals] of Object.entries(groups)) {
        const idx = parseInt(name.replace('field-', ''), 10);
        if (currentForm.fields[idx]) {
          const fieldName = currentForm.fields[idx].name;
          answers[fieldName] = currentForm.fields[idx].type === 'checkbox' ? vals : vals[0];
        }
      }
      try {
        const resp = await submitForm(currentForm.id, answers);
        toast('表单提交成功，ID ' + resp.id);
      } catch (e) { toast('提交失败：' + e.message); }
    }

    init();
  </script>
</body>
</html>
