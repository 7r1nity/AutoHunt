<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>招聘方消息 · 直聊招聘</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/messages.css">
  <link rel="stylesheet" href="/static/css/employer-messages.css">
  <style>.message-empty[hidden]{display:none!important}</style>
</head>
<body class="messages-page employer-messages-page">
<header class="messages-topbar"><div class="messages-topbar-inner">
  <a class="messages-logo" href="/"><span>直聊</span>招聘</a>
  <nav><a href="/">首页</a><a href="/employer.html">招聘方中心</a><a href="/employer.html#tab-apps">收到的投递</a></nav>
  <div class="messages-account"><a class="active" href="/employer-messages.html">消息 <b id="nav-unread"></b></a><a href="/employer.html">职位管理</a><button id="account-button" class="account-button" onclick="openAuth()">登录 / 注册</button></div>
</div></header>

<main class="messages-shell" data-testid="employer-message-workspace">
  <aside class="conversation-pane">
    <div class="conversation-search"><input id="conversation-search" aria-label="搜索候选人" placeholder="搜索候选人或职位" oninput="renderConversations()"><span>⌕</span></div>
    <div class="conversation-tabs" role="tablist"><button class="active" data-filter="all">全部</button><button data-filter="unread">未读</button><button data-filter="pending">待收简历</button><button data-filter="received">已收简历</button></div>
    <div id="conversation-list" class="conversation-list"><div class="conversation-placeholder">登录后查看候选人会话</div></div>
  </aside>
  <section class="message-pane">
    <div id="message-empty" class="message-empty"><div class="empty-icon">✉</div><h2>选择一位候选人</h2><p>沟通记录、附件简历和招聘进度会集中显示在这里。</p></div>
    <div id="message-workspace" class="message-workspace" hidden>
      <header class="chat-profile"><div class="profile-avatar" id="profile-avatar">候</div><div class="profile-main"><div class="profile-line"><h2 id="profile-name">候选人</h2><span class="candidate-tag">候选人</span><span id="profile-online" class="online-badge">● 在线</span></div><p id="profile-summary">正在沟通</p></div><button class="more-button" onclick="openResume()">查看资料</button></header>
      <a id="job-strip" class="job-strip" href="#"><div><b id="job-title">职位名称</b><span id="job-meta"></span></div><strong id="job-salary"></strong><span>查看职位 ›</span></a>
      <div id="message-list" class="message-list"></div>
      <div id="recruiter-toolbar" class="recruiter-toolbar">
        <div class="recruiter-toolbar-copy"><span id="resume-state-icon">↗</span><div><b id="resume-state-title">尚未收到简历</b><small id="resume-state-description">回复候选人后，可邀请其发送简历</small></div></div>
        <button id="request-resume" onclick="requestResume()">邀请发简历</button><button id="view-resume" onclick="openResume()" hidden>查看简历</button>
        <div class="spacer"></div><div id="quick-status" class="quick-status"><button data-status="screening" onclick="setSelectedStatus('screening')">筛选</button><button data-status="interview" onclick="setSelectedStatus('interview')">面试</button><button data-status="offer" onclick="setSelectedStatus('offer')">Offer</button><button data-status="rejected" onclick="setSelectedStatus('rejected')">拒绝</button></div>
      </div>
      <div class="message-composer"><textarea id="message-input" rows="3" placeholder="回复候选人…"></textarea><div><span>Enter 发送，Shift + Enter 换行</span><button id="message-send" onclick="sendCurrentMessage()">发送</button></div></div>
    </div>
  </section>
</main>

<div class="modal" id="auth-modal" aria-hidden="true"><div class="modal-card auth-card">
  <button class="modal-close" onclick="closeAuth()">×</button><div class="auth-mark">招聘</div><h2>招聘方登录</h2><p class="muted">统一测试招聘方可查看全部申请和会话</p>
  <label>邮箱</label><input id="auth-email" type="email" value="autohunt-employer@example.com"><label>姓名 / 昵称</label><input id="auth-name" value="AutoHunt 统一测试招聘方"><label>公司</label><input id="auth-company" value="AutoHunt 测试招聘中心">
  <div id="mfa-row" hidden><label>MFA 验证码</label><input id="auth-code" inputmode="numeric" maxlength="6" placeholder="请输入 6 位验证码"><p id="demo-code" class="demo-code"></p></div>
  <button id="auth-submit" class="primary-wide" onclick="authStep()">获取验证码</button><p class="auth-note">模拟验证码只显示在本页，不会发送真实邮件。</p>
</div></div>

<div class="modal resume-preview-modal" id="resume-modal" aria-hidden="true"><div class="modal-card">
  <button class="modal-close" onclick="closeResume()">×</button><div id="resume-preview"></div>
</div></div>

<script src="/static/js/api.js"></script>
<script>
let conversations=[],applications=[],selected=null,selectedJob=null,selectedMessages=[],activeFilter='all',challengeId='',pollTimer=null;

async function init(){
  bindFilters();document.getElementById('message-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCurrentMessage()}});
  const id=getIdentity();if(!id.userId){openAuth();return}if(id.userRole!=='employer'){document.getElementById('conversation-list').innerHTML='<div class="conversation-placeholder">当前是求职者账号。<a href="/messages.html">打开求职者消息页</a></div>';updateAccount();return}
  await loadWorkspace(true);pollTimer=setInterval(()=>{if(!document.hidden)loadWorkspace(false)},4000);
}
function bindFilters(){document.querySelectorAll('.conversation-tabs button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.conversation-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;renderConversations()})}
function updateAccount(){const id=getIdentity(),btn=document.getElementById('account-button');if(!id.userId){btn.textContent='登录 / 注册';btn.onclick=openAuth;return}btn.textContent=`${id.isTestManager?'统一测试招聘方':'招聘方 #'+id.userId} · 退出`;btn.onclick=()=>{clearIdentity();location.reload()}}
async function loadWorkspace(selectFirst){
  updateAccount();try{const data=await Promise.all([getConversations(),getEmployerApplications({page_size:200})]);conversations=data[0];applications=data[1];renderConversations();if(selected){const fresh=conversations.find(x=>conversationKey(x)===conversationKey(selected));if(fresh)selected=fresh;await loadSelected(false)}else if(selectFirst&&conversations.length)await selectConversation(0)}catch(e){toast('加载招聘方消息失败：'+e.message)}
}
function conversationKey(x){return `${x.user_id}:${x.job_id||'none'}`}
function conversationApplication(x){return applications.find(a=>String(a.job_id)===String(x.job_id)&&String(a.applicant_id)===String(x.user_id))||null}
function visibleConversations(){const q=document.getElementById('conversation-search').value.trim().toLowerCase();return conversations.filter(x=>{const app=conversationApplication(x);const filter=activeFilter==='all'||(activeFilter==='unread'&&x.unread_count>0)||(activeFilter==='pending'&&!app)||(activeFilter==='received'&&!!app);const text=`${x.user_name||''} ${x.job_title||''} ${x.last_message||''}`.toLowerCase();return filter&&(!q||text.includes(q))})}
function renderConversations(){
  const list=document.getElementById('conversation-list'),visible=visibleConversations(),unread=conversations.reduce((sum,x)=>sum+x.unread_count,0);document.getElementById('nav-unread').textContent=unread?Math.min(unread,99):'';
  if(!visible.length){list.innerHTML='<div class="conversation-placeholder">暂无符合条件的候选人会话</div>';return}
  list.innerHTML=visible.map(x=>{const index=conversations.indexOf(x),active=selected&&conversationKey(x)===conversationKey(selected),app=conversationApplication(x);return `<button class="conversation-item ${active?'active':''}" onclick="selectConversation(${index})"><span class="conversation-avatar">${escapeHtml((x.user_name||'候').slice(0,1))}</span><span class="conversation-copy"><span class="conversation-heading"><b>${escapeHtml(x.user_name||'候选人')}</b><time>${formatListTime(x.last_time)}</time></span><span class="conversation-job">${escapeHtml(x.job_title||'平台会话')}${app?' · 已收简历':''}</span><span class="conversation-preview">${escapeHtml(x.last_message||'')}</span></span>${x.unread_count?`<i class="unread-count">${Math.min(x.unread_count,99)}</i>`:''}</button>`}).join('')
}
async function selectConversation(index){selected=conversations[index];renderConversations();document.getElementById('message-empty').hidden=true;document.getElementById('message-workspace').hidden=false;await loadSelected(true)}
async function loadSelected(scroll){if(!selected)return;try{const tasks=[getMessages(selected.user_id,selected.job_id)];if(selected.job_id)tasks.push(getJob(selected.job_id));const result=await Promise.all(tasks);selectedMessages=result[0];selectedJob=result[1]||null;renderSelected(scroll)}catch(e){toast('读取会话失败：'+e.message)}}
function renderSelected(scroll){
  document.getElementById('profile-avatar').textContent=(selected.user_name||'候').slice(0,1);document.getElementById('profile-name').textContent=selected.user_name||'候选人';document.getElementById('profile-summary').textContent=conversationApplication(selected)?'已投递候选人 · 可查看附件简历':'正在沟通 · 尚未发送简历';
  const strip=document.getElementById('job-strip');if(selectedJob){strip.hidden=false;strip.href=`/job.html?id=${selectedJob.id}`;document.getElementById('job-title').textContent=selectedJob.title;document.getElementById('job-meta').textContent=`${selectedJob.city} · ${selectedJob.experience_required} · ${selectedJob.education}`;document.getElementById('job-salary').textContent=formatSalary(selectedJob)}else strip.hidden=true;
  const me=getIdentity(),list=document.getElementById('message-list');list.innerHTML=selectedMessages.length?selectedMessages.map(m=>renderMessage(m,me)).join(''):'<div class="chat-empty-state">暂无消息</div>';updateRecruiterToolbar();if(scroll)list.scrollTop=list.scrollHeight;
}
function isMine(m,me){return me.isTestManager?m.sender_role==='employer':String(m.sender_id)===String(me.userId)}
function renderMessage(m,me){const mine=isMine(m,me),content=String(m.content||''),isResume=content.includes('【简历已发送】')||content.includes('【已投递】');if(isResume)return `<div class="message-system-card resume-file-card"><span class="file-icon">▤</span><div><b>${escapeHtml(content.replace(/^【.*?】/,'').trim()||'候选人附件简历')}</b><small>候选人已发送附件简历</small></div><button onclick="openResume()">查看简历</button></div>`;return `<div class="message-row ${mine?'mine':''}"><span class="message-avatar">${mine?'我':escapeHtml((selected.user_name||'候').slice(0,1))}</span><div><time>${formatMessageTime(m.created_at)}</time><p>${escapeHtml(content)}</p></div></div>`}
function updateRecruiterToolbar(){const app=conversationApplication(selected),toolbar=document.getElementById('recruiter-toolbar'),request=document.getElementById('request-resume'),view=document.getElementById('view-resume');toolbar.classList.toggle('has-resume',!!app);view.hidden=!app;request.hidden=!!app||!selectedJob;if(app){document.getElementById('resume-state-icon').textContent='✓';document.getElementById('resume-state-title').textContent=`已收到简历 · ${applicationStatusLabel(app.status)}`;document.getElementById('resume-state-description').textContent=`投递 #${app.id} · 可在消息页预览和推进状态`}else{document.getElementById('resume-state-icon').textContent='↗';document.getElementById('resume-state-title').textContent='尚未收到简历';document.getElementById('resume-state-description').textContent=selectedJob?'回复候选人后，可邀请其发送简历':'平台会话未关联职位'}document.querySelectorAll('#quick-status button').forEach(btn=>btn.classList.toggle('active',!!app&&btn.dataset.status===app.status))}
async function sendCurrentMessage(){if(!selected)return toast('请先选择候选人');const input=document.getElementById('message-input'),content=input.value.trim();if(!content)return;const btn=document.getElementById('message-send');btn.disabled=true;try{await sendMessage({recipient_id:selected.user_id,job_id:selected.job_id,content});input.value='';await loadWorkspace(false);document.getElementById('message-list').scrollTop=document.getElementById('message-list').scrollHeight}catch(e){toast('发送失败：'+e.message)}finally{btn.disabled=false}}
async function requestResume(){if(!selected||!selectedJob)return toast('当前会话没有关联职位');document.getElementById('message-input').value=`你的经历与「${selectedJob.title}」岗位比较匹配，请发送附件简历，方便进一步评估。`;await sendCurrentMessage()}
async function setSelectedStatus(status){const app=conversationApplication(selected);if(!app)return toast('候选人尚未发送简历');try{await updateApplicationStatus(app.id,status);toast('招聘状态已更新');await loadWorkspace(false)}catch(e){toast('更新失败：'+e.message)}}
function openResume(){const app=conversationApplication(selected);if(!app||!app.resume)return toast('当前会话还没有可查看的简历');const r=app.resume,skills=(r.skills||[]).map(x=>`<span>${escapeHtml(x)}</span>`).join(''),history=escapeHtml(JSON.stringify(r.work_history||[],null,2));document.getElementById('resume-preview').innerHTML=`<div class="resume-preview-header"><div class="resume-preview-avatar">${escapeHtml((selected.user_name||'候').slice(0,1))}</div><div><h2>${escapeHtml(selected.user_name||'候选人')}</h2><p class="muted">应聘 ${escapeHtml(selected.job_title||'当前职位')} · 投递 #${app.id}</p></div></div><div class="resume-preview-grid"><div class="resume-preview-section"><h4>${escapeHtml(r.name||'候选人简历')}</h4><p>${escapeHtml(r.summary||'暂无职业摘要')}</p><p><strong>学历：</strong>${escapeHtml(r.education||'未填写')}　<strong>经验：</strong>${escapeHtml(resumeExperienceLabel(r))}</p></div><div class="resume-preview-section"><h4>技能</h4><div class="resume-skills">${skills||'<span>暂无技能</span>'}</div></div></div><div class="resume-preview-section"><h4>经历</h4><pre>${history||'暂无经历'}</pre></div>${app.cover_letter?`<div class="resume-preview-section"><h4>求职信</h4><p>${escapeHtml(app.cover_letter)}</p></div>`:''}`;document.getElementById('resume-modal').classList.add('open');document.getElementById('resume-modal').setAttribute('aria-hidden','false')}
function closeResume(){document.getElementById('resume-modal').classList.remove('open');document.getElementById('resume-modal').setAttribute('aria-hidden','true')}
function applicationStatusLabel(s){return({submitted:'等待筛选',screening:'筛选中',interview:'进入面试',offer:'已发 Offer',rejected:'未通过'})[s]||s}
function formatListTime(v){const d=new Date(v),now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return `${d.getMonth()+1}月${d.getDate()}日`}
function formatMessageTime(v){return new Date(v).toLocaleString([],{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function openAuth(){document.getElementById('auth-modal').classList.add('open');document.getElementById('auth-modal').setAttribute('aria-hidden','false')}
function closeAuth(){document.getElementById('auth-modal').classList.remove('open');document.getElementById('auth-modal').setAttribute('aria-hidden','true')}
async function authStep(){const email=document.getElementById('auth-email').value.trim(),name=document.getElementById('auth-name').value.trim()||'招聘负责人',company=document.getElementById('auth-company').value.trim()||null;if(!email)return toast('请填写邮箱');try{if(!challengeId){const c=await requestMfa(email);challengeId=c.challenge_id;document.getElementById('mfa-row').hidden=false;document.getElementById('demo-code').textContent=`模拟验证码：${c.demo_code}`;document.getElementById('auth-submit').textContent='验证并登录';return}await verifyMfa(challengeId,document.getElementById('auth-code').value.trim());const user=await registerUser('employer',name,email,null,company);setIdentity(user.id,'employer',user.email);closeAuth();await loadWorkspace(true);pollTimer=setInterval(()=>{if(!document.hidden)loadWorkspace(false)},4000)}catch(e){toast('登录失败：'+e.message)}}
window.addEventListener('beforeunload',()=>{if(pollTimer)clearInterval(pollTimer)});init();
</script>
</body>
</html>
